<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Maré Residencial Pirangi — Tour Virtual 360°</title>
<meta name="description" content="Houses com piscina, apartamentos com vista para o mar e rooftop de lazer. Lançamento em Pirangi, litoral sul de Natal.">
<meta property="og:title" content="Maré Residencial Pirangi — Tour virtual 360°">
<meta property="og:description" content="Houses com piscina, apartamentos com vista para o mar e rooftop de lazer.">
<meta property="og:image" content="img/ext-06-aerea-01.jpg">
<meta name="theme-color" content="#0f2a33">
<link rel="preload" href="fonts/marcellus-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230f2a33%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Georgia%22 font-size=%2216%22 text-anchor=%22middle%22 fill=%22%23f3f4ef%22%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/pannellum.css">
<style>
@font-face{font-family:"Marcellus";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/marcellus-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:300;font-display:swap;src:url(fonts/figtree-latin-300-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Figtree";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2")}
:root{
  /* identidade do book */
  --paper:#f3f4ef; --mist:#dce6e1; --mist-2:#c9d9d2; --deep:#0f2a33; --deep-2:#1c3b45; --teal:#2e6b66;
  --ink:#0f2a33; --muted:#5d6e71; --line:rgba(15,42,51,.12);
  --glass:rgba(15,42,51,.48); --glass-b:rgba(255,255,255,.16);
  --r-xl:28px; --r-lg:22px; --r-md:14px; --r-sm:10px;
  --serif:"Marcellus",Georgia,serif; --sans:"Figtree",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);color:#fff;font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#pano{position:fixed;inset:0;background:var(--deep)}

/* ---------- Pannellum ---------- */
.pnlm-container{background:var(--deep)!important;font-family:var(--sans)!important}
.pnlm-load-box,.pnlm-about-msg,.pnlm-controls-container,.pnlm-compass,.pnlm-load-button,.pnlm-panel,.pnlm-title-box,.pnlm-author-box{display:none!important}
.pnlm-error-msg{background:rgba(15,42,51,.92)!important;font-family:var(--sans)!important;border-radius:var(--r-md)}

/* ---------- Pílulas (como no book) ---------- */
.chip{display:inline-flex;align-items:center;height:24px;padding:0 11px;border-radius:999px;background:#fff;color:var(--deep);font-size:11.5px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
.chip.teal{background:var(--teal);color:#fff}

/* ---------- Hotspots ---------- */
.hs{position:absolute;width:0;height:0;cursor:pointer}
.hs .dot{position:absolute;left:-21px;top:-21px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(15,42,51,.28);transition:transform .35s var(--ease),background .25s}
.hs .dot svg{width:17px;height:17px;stroke:var(--deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hs .dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7);animation:ring 2.6s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.45);opacity:0}}
.hs .lbl{position:absolute;left:50%;top:30px;transform:translateX(-50%);white-space:nowrap;height:28px;display:flex;align-items:center;
  font-size:12.5px;font-weight:500;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.94);color:var(--deep);
  box-shadow:0 6px 18px rgba(15,42,51,.22);pointer-events:none}
.hs:hover .dot{transform:scale(1.1)}
.hs.info .dot{width:28px;height:28px;left:-14px;top:-14px;background:var(--teal)}
.hs.info .dot svg{stroke:#fff;width:14px;height:14px}
.hs.info .dot::after{display:none}
.hs.info .lbl{top:20px;background:rgba(15,42,51,.72);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* ---------- Camadas de leitura ---------- */
.shade-t{position:fixed;left:0;right:0;top:0;height:140px;background:linear-gradient(to bottom,rgba(15,42,51,.55),rgba(15,42,51,0));pointer-events:none;z-index:3}
.shade-b{position:fixed;left:0;right:0;bottom:0;height:300px;background:linear-gradient(to top,rgba(15,42,51,.78),rgba(15,42,51,0));pointer-events:none;z-index:3}

/* ---------- Topo ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:5;padding:calc(20px + var(--safe-t)) calc(26px + var(--safe-r)) 0 calc(26px + var(--safe-l));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.wordmark{font-family:var(--serif);font-size:15px;letter-spacing:.32em;color:#fff;pointer-events:auto}
.top-r{display:flex;gap:8px;pointer-events:auto}

/* ---------- Cena (título como nas páginas de foto do book) ---------- */
#scene{position:fixed;left:calc(26px + var(--safe-l));bottom:calc(92px + var(--safe-b));z-index:5;max-width:min(620px,70vw);pointer-events:none}
#scene .title{font-family:var(--serif);font-size:clamp(28px,3.4vw,44px);line-height:1.08;margin:12px 0 8px;font-weight:400}
#scene .desc{font-size:14.5px;line-height:1.5;color:rgba(255,255,255,.86);font-weight:300;max-width:520px}
#scene.swap .title,#scene.swap .desc,#scene.swap .chip{animation:rise .6s var(--ease) both}
#scene.swap .desc{animation-delay:.06s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note{position:fixed;right:calc(26px + var(--safe-r));bottom:calc(98px + var(--safe-b));z-index:5;font-size:11px;color:rgba(255,255,255,.6);pointer-events:none}

/* ---------- Barra ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 calc(20px + var(--safe-r)) calc(20px + var(--safe-b)) calc(20px + var(--safe-l));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.grp{display:flex;gap:8px;align-items:center;pointer-events:auto}
.btn{height:44px;min-width:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  font-size:13.5px;font-weight:500;color:#fff;transition:background .25s,transform .25s var(--ease),color .25s}
.btn:hover{background:rgba(15,42,51,.68)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn.icon{padding:0;width:44px}
.btn.light{background:var(--paper);color:var(--deep);border-color:transparent}
.btn.light:hover{background:#fff}
.btn.on,.btn.light.on,.btn.light.on:hover{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.hide{display:none}
.count{font-size:12px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;padding:0 6px}

/* ---------- Gaveta de ambientes (página clara do book) ---------- */
#drawer{position:fixed;left:calc(20px + var(--safe-l));right:calc(20px + var(--safe-r));bottom:calc(80px + var(--safe-b));z-index:7;
  background:var(--paper);color:var(--ink);border-radius:var(--r-xl);padding:20px 22px 18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(8,22,27,.35);transform:translateY(16px);opacity:0;visibility:hidden;transition:transform .45s var(--ease),opacity .35s,visibility .45s}
#drawer.open{transform:none;opacity:1;visibility:visible}
#drawer::before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;background:var(--mist);border-radius:0 0 0 90px;pointer-events:none}
.d-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.d-head h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:0}
.tabs{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.tabs::-webkit-scrollbar{display:none}
.tab{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--deep);border:1px solid var(--line);transition:background .2s,color .2s}
.tab:hover{background:var(--mist)}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.strip{position:relative;display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--mist-2) transparent}
.th{flex:none;width:176px;scroll-snap-align:start;text-align:left}
.th .img{width:176px;height:110px;border-radius:var(--r-md);background-size:340% auto;background-color:var(--mist);transition:transform .35s var(--ease),box-shadow .3s}
.th .cap{font-size:13px;margin-top:8px;color:var(--ink);line-height:1.3}
.th:hover .img{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,42,51,.16)}
.th.on .img{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--teal)}
.th.on .cap{color:var(--teal);font-weight:500}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--deep)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

/* ---------- Loader ---------- */
#loader{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;height:38px;padding:0 16px;border-radius:999px;display:flex;align-items:center;gap:10px;
  background:var(--glass);border:1px solid var(--glass-b);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#loader.on{opacity:1}
#loader i{width:14px;height:14px;border-radius:50%;border:1.6px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Abertura (capa do book) ---------- */
#intro{position:fixed;inset:0;z-index:20;background:var(--deep);transition:opacity .9s ease,visibility .9s}
#intro.hide{opacity:0;visibility:hidden}
.kb{position:absolute;inset:0;overflow:hidden}
.kb div{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 2s ease;animation:kb 16s linear infinite}
.kb div.on{opacity:1}
@keyframes kb{0%{transform:scale(1)}100%{transform:scale(1.1) translate(-1.5%,-1%)}}
#intro::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,42,51,.72) 0%,rgba(15,42,51,.25) 55%,rgba(15,42,51,.05) 100%),linear-gradient(to top,rgba(15,42,51,.65),rgba(15,42,51,0) 55%)}
.cover{position:absolute;z-index:2;left:calc(clamp(24px,5vw,72px) + var(--safe-l));bottom:calc(clamp(28px,7vh,80px) + var(--safe-b));right:24px;max-width:720px}
.cover h1{font-family:var(--serif);font-weight:400;font-size:clamp(68px,11vw,150px);line-height:.9;margin:0;letter-spacing:.01em}
.cover .sub{font-size:12px;letter-spacing:.42em;text-transform:uppercase;margin:14px 0 0 4px}
.cover p{font-size:clamp(15px,1.4vw,18px);font-weight:300;line-height:1.5;margin:22px 0 0 2px;max-width:520px;color:rgba(255,255,255,.9)}
.cover .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.cover .btn{height:50px;padding:0 22px;font-size:14.5px}
.cover-tag{position:absolute;z-index:2;right:calc(clamp(24px,5vw,72px) + var(--safe-r));bottom:calc(clamp(28px,7vh,80px) + var(--safe-b));display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cover-tag small{font-size:11px;color:rgba(255,255,255,.6)}
.cover-top{position:absolute;z-index:2;top:calc(22px + var(--safe-t));left:calc(clamp(24px,5vw,72px) + var(--safe-l));right:calc(clamp(24px,5vw,72px) + var(--safe-r));display:flex;justify-content:space-between;align-items:center}
.cover-top .wordmark{font-size:14px}
.cover-top span{font-size:12px;color:rgba(255,255,255,.75)}

/* ---------- Apresentação (páginas claras do book) ---------- */
#gal{position:fixed;inset:0;z-index:25;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;overflow:hidden}
#gal.open{opacity:1;visibility:visible}
#gal::before{content:"";position:absolute;left:-60px;bottom:-60px;width:min(30vw,340px);height:min(30vw,340px);background:var(--mist);border-radius:0 120px 0 0;pointer-events:none}
.g-top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:calc(18px + var(--safe-t)) calc(26px + var(--safe-r)) 12px calc(26px + var(--safe-l))}
.g-top .wordmark{color:var(--deep)}
.g-chap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center}
.g-chap::-webkit-scrollbar{display:none}
.g-chap .cbtn{flex:none}
.g-btns{display:flex;gap:8px}
.cbtn{height:40px;min-width:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;color:var(--deep);transition:background .2s,color .2s}
.cbtn:hover{background:var(--mist)}
.cbtn.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.cbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cbtn.icon{padding:0;width:40px}
.g-body{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:clamp(20px,3vw,44px);padding:8px calc(26px + var(--safe-r)) 8px calc(clamp(26px,4vw,56px) + var(--safe-l))}
.g-text{align-self:center;padding-bottom:40px}
.g-text .title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,3.2vw,46px);line-height:1.08;margin:16px 0 14px}
.g-text .desc{font-size:15px;line-height:1.6;color:var(--muted);font-weight:400}
.g-text .meta{display:flex;align-items:center;gap:14px;margin-top:26px}
.g-text .n{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.g-frame{position:relative;min-height:0;display:grid;place-items:center;touch-action:pan-y}
.g-frame img{grid-area:1/1;max-width:100%;max-height:100%;border-radius:var(--r-lg);opacity:0;transition:opacity .6s ease;user-select:none;-webkit-user-drag:none;box-shadow:0 18px 50px rgba(15,42,51,.14)}
.g-frame img.on{opacity:1}
.g-card{grid-area:1/1;width:100%;height:100%;max-height:640px;border-radius:var(--r-lg);background:var(--deep);color:#fff;padding:clamp(26px,4vw,56px);display:none;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.g-card.on{display:flex;animation:rise .6s var(--ease) both}
.g-card::after{content:"";position:absolute;right:-50px;top:-50px;width:220px;height:220px;background:var(--deep-2);border-radius:0 0 0 110px}
.g-card h4{position:relative;z-index:1;font-family:var(--serif);font-weight:400;font-size:clamp(26px,2.6vw,38px);margin:0 0 26px;line-height:1.15}
.g-card .stats{display:flex;gap:clamp(24px,5vw,70px);flex-wrap:wrap}
.g-card .stat b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(46px,6vw,84px);line-height:1;color:#b9d6cf}
.g-card .stat b.w{color:#fff}
.g-card .stat span{display:block;font-size:13px;color:rgba(255,255,255,.75);margin-top:10px}
.g-card .src{font-size:11.5px;color:rgba(255,255,255,.5);margin-top:34px}
.g-card ul{list-style:none;margin:0;padding:0;position:relative;z-index:1}
.g-card li{display:grid;grid-template-columns:minmax(180px,250px) 1fr;gap:18px;padding:13px 0;border-top:1px solid rgba(255,255,255,.12);font-size:14px}
.g-card li:last-child{border-bottom:1px solid rgba(255,255,255,.12)}
.g-card li b{font-weight:500}
.g-card li span{color:rgba(255,255,255,.72)}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(243,244,239,.92);display:grid;place-items:center;z-index:2;box-shadow:0 6px 20px rgba(15,42,51,.18);transition:transform .25s var(--ease)}
.g-nav:hover{transform:translateY(-50%) scale(1.06)}
.g-nav svg{width:18px;height:18px;stroke:var(--deep);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.g-nav.l{left:14px}.g-nav.r{right:14px}
.g-strip{position:relative;display:flex;gap:8px;overflow-x:auto;padding:12px calc(26px + var(--safe-r)) calc(16px + var(--safe-b)) calc(26px + var(--safe-l));scrollbar-width:none}
.g-strip::-webkit-scrollbar{display:none}
.g-strip button{flex:none;width:84px;height:54px;border-radius:var(--r-sm);background-size:cover;background-position:center;background-color:var(--deep);opacity:.55;transition:opacity .2s,box-shadow .2s}
.g-strip button.txt{display:grid;place-items:center;font-family:var(--serif);font-size:11px;color:#fff;padding:4px;text-align:center;line-height:1.15}
.g-strip button.on{opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--teal)}
.g-strip button:hover{opacity:.9}
.g-prog{position:absolute;left:0;bottom:0;height:2px;background:var(--teal);width:0}
.g-prog.run{animation:prog linear forwards}
@keyframes prog{to{width:100%}}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(10px);z-index:40;background:var(--paper);color:var(--deep);
  font-size:13px;font-weight:500;height:38px;display:flex;align-items:center;padding:0 18px;border-radius:999px;opacity:0;transition:.3s var(--ease);pointer-events:none;box-shadow:0 10px 30px rgba(8,22,27,.3)}
#toast.on{opacity:1;transform:translateX(-50%)}
#coords{position:fixed;left:50%;top:50%;z-index:9;transform:translate(-50%,-50%);pointer-events:none;display:none;font:12px monospace;color:#fff;text-shadow:0 0 3px #000}
#coords::before{content:"+";display:block;text-align:center;font-size:22px}

@media (max-width:820px){
  .g-body{grid-template-columns:1fr;grid-template-rows:1fr auto;gap:14px;padding:4px 18px 0}
  .g-text{order:2;padding-bottom:0}
  .g-text .title{font-size:26px;margin:10px 0 8px}
  .g-text .desc{font-size:14px;line-height:1.5}
  .g-text .meta{margin-top:12px}
  .g-chap{justify-content:flex-start}
  .g-top .wordmark{display:none}
  .g-card li{grid-template-columns:1fr;gap:4px}
  .g-nav{display:none}
}
@media (max-width:640px){
  #top{padding-left:calc(20px + var(--safe-l));padding-right:calc(20px + var(--safe-r))}
  #scene{left:calc(20px + var(--safe-l));right:20px;bottom:calc(84px + var(--safe-b));max-width:none}
  #scene .title{font-size:28px}
  #scene .desc{font-size:13.5px}
  .note{display:none}
  #bar{padding:0 calc(14px + var(--safe-r)) calc(16px + var(--safe-b)) calc(14px + var(--safe-l))}
  .btn .t{display:none}
  .btn{padding:0;width:44px}
  .btn.menu{width:auto;padding:0 16px}.btn.menu .t{display:inline}
  #bPrev,#bNext,#bFull,.count{display:none}
  .grp{gap:6px}
  #drawer{left:10px;right:10px;bottom:calc(72px + var(--safe-b));padding:18px 16px 14px;border-radius:24px}
  .th{width:140px}.th .img{width:140px;height:88px}
  .cover-tag{display:none}
  .cover .btn{height:48px;width:auto;padding:0 18px;font-size:14px}
  .cover-top span{display:none}
}
</style>
</head>
<body>
<div id="pano"></div>
<div class="shade-t"></div><div class="shade-b"></div>
<div id="loader"><i></i>Carregando ambiente</div>

var ICON = {
  go:'<svg viewBox="0 0 24 24"><path d="M12 19V6M6.5 11.5L12 6l5.5 5.5"/></svg>',
  "in":'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M6.5 14L12 8.5l5.5 5.5M6.5 19L12 13.5l5.5 5.5"/></svg>',
  info:'<svg viewBox="0 0 24 24"><path d="M12 11v6M12 7.5v.2"/></svg>'
};
var byId = {}; SCENES.forEach(function(s,i){ s.i=i; byId[s.id]=s; });
function hotspotTooltip(div, a){
  div.classList.add("hs"); if(a.kind==="info") div.classList.add("info");
  div.innerHTML = '<div class="dot">'+(ICON[a.kind]||ICON.go)+'</div><div class="lbl">'+a.label+'</div>';
}
var scenesCfg = {};
SCENES.forEach(function(s){
  scenesCfg[s.id] = {
    title:s.t, type:"equirectangular", panorama:"pano/"+s.file+".jpg?v="+V,
    yaw:s.yaw, pitch:s.pitch, hfov:s.hfov||100,
    hotSpots: s.h.map(function(h){
      var kind=h[4]||"go", spot={pitch:+h[2], yaw:+h[1], cssClass:"hs-wrap", createTooltipFunc:hotspotTooltip, createTooltipArgs:{label:h[3],kind:kind}};
      if(h[0]){ spot.type="scene"; spot.sceneId=h[0]; spot.targetYaw=byId[h[0]].yaw; spot.targetPitch=byId[h[0]].pitch; }
      else spot.type="info";
      return spot;
    })
  };
});

var start=(location.hash||"").slice(1); if(!byId[start]) start="aerea";
var viewer=null, current=start;

function boot(){
  viewer = pannellum.viewer("pano", {
    "default":{firstScene:start, sceneFadeDuration:900, autoLoad:true, showControls:false, compass:false,
      minHfov:40, maxHfov:120, friction:.12, mouseZoom:true, keyboardZoom:true,
      strings:{loadingLabel:"Carregando...", loadButtonLabel:"Carregar", bylineLabel:"",
        noPanoramaError:"Imagem não encontrada.", fileAccessError:"Não foi possível abrir a imagem.",
        malformedURLError:"Endereço inválido.", iOS8WebGLError:"Atualize o navegador.",
        genericWebGLError:"Seu navegador não suporta WebGL.",
        textureSizeError:"Esta imagem é grande demais para o seu dispositivo.", unknownError:"Erro desconhecido."}},
    scenes: scenesCfg
  });
  viewer.on("scenechange", function(id){ current=id; showLoader(true); updateUI(); });
  viewer.on("load", function(){ showLoader(false); prefetch(current); if(auto) scheduleAuto(); });
  viewer.on("mousedown", stopAuto); viewer.on("touchstart", stopAuto);
  showLoader(true); updateUI();
}
function showLoader(on){ $("loader").classList.toggle("on", on); }

/* gaveta */
function buildTabs(){
  $("tabs").innerHTML = SECTORS.map(function(s){ return '<button class="tab" data-s="'+s.id+'">'+s.name+'</button>'; }).join("");
  $("tabs").addEventListener("click", function(e){ var b=e.target.closest(".tab"); if(b) renderStrip(b.dataset.s); });
}
function thumbX(yaw){ var f=(yaw+180)/360, vis=1/3.4; return Math.max(0,Math.min(100,(f-vis/2)/(1-vis)*100)); }
function renderStrip(sid){
  [].forEach.call($("tabs").children, function(b){ b.classList.toggle("on", b.dataset.s===sid); });
  $("strip").innerHTML = SCENES.filter(function(s){return s.s===sid}).map(function(s){
    return '<button class="th'+(s.id===current?' on':'')+'" data-id="'+s.id+'"><div class="img" style="background-image:url(thumb/'+s.file+'.jpg?v='+V+');background-position:'+thumbX(s.yaw)+'% '+(50-s.pitch*0.6)+'%"></div><div class="cap">'+s.t+'</div></button>';
  }).join("");
}
$("strip").addEventListener("click", function(e){ var b=e.target.closest(".th"); if(b){ stopAuto(); go(b.dataset.id); } });
function setDrawer(open){ $("drawer").classList.toggle("open",open); $("bMenu").classList.toggle("on",open); $("scene").style.opacity=open?0:1; }
$("bMenu").onclick=function(){ setDrawer(!$("drawer").classList.contains("open")); };
$("dClose").onclick=function(){ setDrawer(false); };

function updateUI(){
  var s=byId[current], sec=SECTORS.filter(function(x){return x.id===s.s})[0];
  $("mSector").textContent=sec.name; $("mTitle").textContent=s.t; $("mDesc").textContent=s.d;
  var sc=$("scene"); sc.classList.remove("swap"); void sc.offsetWidth; sc.classList.add("swap");
  $("counter").textContent=String(s.i+1).padStart(2,"0")+" / "+String(SCENES.length).padStart(2,"0");
  renderStrip(s.s);
  var th=$("strip").querySelector(".th.on"); if(th && $("drawer").classList.contains("open")) th.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  try{ history.replaceState(null,"","#"+current); }catch(e){}
  document.title=s.t+" — Maré Residencial Pirangi";
  $("bPhoto").classList.toggle("hide", photoFor(current)<0);
}
function go(id){ if(!viewer||id===current) return; var s=byId[id]; viewer.loadScene(id, s.pitch, s.yaw, s.hfov||100); }
function step(d){ go(SCENES[(byId[current].i+d+SCENES.length)%SCENES.length].id); }

var fetched={};
function prefetch(id){
  var s=byId[id], next=[];
  s.h.forEach(function(h){ if(h[0]) next.push(h[0]); });
  next.push(SCENES[(s.i+1)%SCENES.length].id);
  next.slice(0,3).forEach(function(n){ var u="pano/"+byId[n].file+".jpg?v="+V; if(fetched[u]) return; fetched[u]=1;
    setTimeout(function(){ try{ var im=new Image(); im.src=u; }catch(e){} },600); });
}

var auto=false, autoT=null;
function scheduleAuto(){ clearTimeout(autoT); viewer.startAutoRotate(-4); autoT=setTimeout(function(){ if(auto) step(1); },16000); }
function startAuto(){ auto=true; $("bAuto").classList.add("on"); scheduleAuto(); toast("Passeio automático ligado"); }
function stopAuto(){ if(!auto) return; auto=false; clearTimeout(autoT); $("bAuto").classList.remove("on"); try{viewer.stopAutoRotate();}catch(e){} }

$("bPrev").onclick=function(){ stopAuto(); step(-1); };
$("bNext").onclick=function(){ stopAuto(); step(1); };
$("bAuto").onclick=function(){ auto?stopAuto():startAuto(); };
$("bFull").onclick=function(){
  var el=document.documentElement;
  try{ if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { var r=(el.requestFullscreen||el.webkitRequestFullscreen); if(r){ var p=r.call(el); if(p&&p.catch) p.catch(function(){toast("Tela cheia indisponível aqui")}); } else toast("Tela cheia indisponível aqui"); } }
  catch(e){ toast("Tela cheia indisponível aqui"); }
};
$("bShare").onclick=function(){
  var url=location.href.split("#")[0]+"#"+current;
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(function(){toast("Link deste ambiente copiado")},function(){toast(url)});
  else toast(url);
};
var toastT; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on")},2600); }

var CARDS={
  stats:'<div class="stats"><div class="stat"><b>+5,33%</b><span>Natal, de janeiro a agosto</span></div><div class="stat"><b class="w">+3,44%</b><span>Média nacional no mesmo período</span></div></div><div class="src">Fonte: Índice FipeZap, publicado em Paraíba Business (30/09/2026).</div>',
  list:'<ul><li><b>Houses com piscina privativa</b><span>Casa térrea com deck e jardim, dentro de um condomínio à beira-mar.</span></li><li><b>Rooftop com vista para o mar</b><span>Piscina, gourmet, churrasqueira e academia no último pavimento.</span></li><li><b>Varandas abertas para o Atlântico</b><span>Dunas e mar a partir dos apartamentos.</span></li><li><b>Arquitetura autoral</b><span>Tijolo aparente e lajes em onda, uma fachada que se reconhece de longe.</span></li><li><b>Pirangi, litoral sul de Natal</b><span>Perto da capital e longe do ritmo da cidade.</span></li></ul>'
};
var gi=0, gPlayT=null, gFlip=false, G_MS=6000;
function chapName(c){ return CHAPTERS.filter(function(x){return x.id===c})[0].name; }
$("gChap").innerHTML=CHAPTERS.map(function(c){return '<button class="cbtn" data-c="'+c.id+'">'+c.name+'</button>'}).join("");
$("gStrip").innerHTML=PHOTOS.map(function(p,i){
  return p.card ? '<button class="txt" data-i="'+i+'">'+(p.card==="stats"?"+5,33%":"O Maré")+'</button>'
                : '<button data-i="'+i+'" style="background-image:url(imgthumb/'+p.f+'.jpg)" aria-label="'+p.t+'"></button>';
}).join("");
function gShow(i){
  gi=(i+PHOTOS.length)%PHOTOS.length; var p=PHOTOS[gi];
  var a=$(gFlip?"gImgA":"gImgB"), b=$(gFlip?"gImgB":"gImgA"), card=$("gCard");
  if(p.card){
    a.classList.remove("on"); b.classList.remove("on");
    card.innerHTML=CARDS[p.card]; card.classList.remove("on"); void card.offsetWidth; card.classList.add("on");
  } else {
    card.classList.remove("on"); gFlip=!gFlip;
    a.onload=function(){ a.classList.add("on"); b.classList.remove("on"); };
    a.src="img/"+p.f+".jpg"; a.alt=p.t;
    if(a.complete && a.naturalWidth){ a.classList.add("on"); b.classList.remove("on"); }
  }
  $("gK").textContent=chapName(p.c); $("gT").textContent=p.t; $("gD").textContent=p.d;
  [$("gK"),$("gT"),$("gD")].forEach(function(el){ el.style.animation="none"; void el.offsetWidth; el.style.animation="rise .6s cubic-bezier(.22,.7,.2,1) both"; });
  $("gN").textContent=String(gi+1).padStart(2,"0")+" / "+PHOTOS.length;
  $("g360").style.display=p.s?"":"none";
  [].forEach.call($("gChap").children,function(b){b.classList.toggle("on",b.dataset.c===p.c)});
  [].forEach.call($("gStrip").children,function(b,j){b.classList.toggle("on",j===gi)});
  var t=$("gStrip").children[gi]; if(t) t.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  for(var k=1;k<=2;k++){ var q=PHOTOS[(gi+k)%PHOTOS.length]; if(q.f){ var n=new Image(); n.src="img/"+q.f+".jpg"; } }
  if(gPlayT) runProg();
}
function runProg(){ var g=$("gProg"); g.classList.remove("run"); void g.offsetWidth; g.style.animationDuration=G_MS+"ms"; g.classList.add("run"); }
function gOpen(i){ stopAuto(); setDrawer(false); $("gal").classList.add("open"); gShow(i||0); }
function gClose(){ gStop(); $("gal").classList.remove("open"); }
function gStart(){ $("gPlay").classList.add("on"); clearInterval(gPlayT); gPlayT=setInterval(function(){gShow(gi+1)},G_MS); runProg(); }
function gStop(){ $("gPlay").classList.remove("on"); clearInterval(gPlayT); gPlayT=null; $("gProg").classList.remove("run"); }
$("gPrev").onclick=function(){gStop();gShow(gi-1)};
$("gNext").onclick=function(){gStop();gShow(gi+1)};
$("gPlay").onclick=function(){ gPlayT?gStop():gStart(); };
$("gClose").onclick=gClose;
$("gStrip").onclick=function(e){var b=e.target.closest("button"); if(b){gStop();gShow(+b.dataset.i)}};
$("gChap").onclick=function(e){var b=e.target.closest(".cbtn"); if(!b) return; gStop(); for(var i=0;i<PHOTOS.length;i++) if(PHOTOS[i].c===b.dataset.c){gShow(i);break;}};
$("g360").onclick=function(){ var sc=PHOTOS[gi].s; gClose(); $("intro").classList.add("hide"); if(sc!==current) go(sc); };
(function(){ var x0=null, st=$("gStage");
  st.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  st.addEventListener("touchend",function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>45){gStop();gShow(gi+(dx<0?1:-1))} x0=null; });
})();
function photoFor(id){ for(var i=0;i<PHOTOS.length;i++) if(PHOTOS[i].s===id) return i; return -1; }
$("bGal").onclick=function(){ var k=photoFor(current); gOpen(k<0?0:k); };
$("bPhoto").onclick=function(){ var k=photoFor(current); if(k>=0) gOpen(k); };
$("bPres").onclick=function(){ gOpen(0); gStart(); };
$("bStart").onclick=function(){ $("intro").classList.add("hide"); };

/* teclado */
document.addEventListener("keydown", function(e){
  if($("gal").classList.contains("open")){
    if(e.key==="ArrowRight"){gStop();gShow(gi+1)} if(e.key==="ArrowLeft"){gStop();gShow(gi-1)} if(e.key==="Escape") gClose(); return;
  }
  if(e.key==="Escape") setDrawer(false);
  if(e.key==="ArrowRight"&&e.shiftKey) step(1);
  if(e.key==="ArrowLeft"&&e.shiftKey) step(-1);
  if(e.key==="c"||e.key==="C"){ var c=$("coords"); c.style.display=c.style.display==="block"?"none":"block"; }
});
setInterval(function(){ var c=$("coords"); if(viewer&&c.style.display==="block") c.textContent=current+"  yaw "+viewer.getYaw().toFixed(0)+"  pitch "+viewer.getPitch().toFixed(0); },200);
window.addEventListener("hashchange", function(){ var h=location.hash.slice(1); if(byId[h]&&h!==current) go(h); });

/* abertura com as aéreas */
(function(){ var list=["ext-06-aerea-01","ext-07-aerea-02","ext-10-aerea-lazer","ext-19-vista-piscina","ext-01-fachada"], k=0, kb=$("kb");
  kb.innerHTML=list.map(function(f){return '<div style="background-image:url(img/'+f+'.jpg)"></div>'}).join("");
  var els=kb.children; els[0].classList.add("on");
  setInterval(function(){ if($("intro").classList.contains("hide")) return; els[k].classList.remove("on"); k=(k+1)%els.length; els[k].classList.add("on"); },6000);
})();

buildTabs();
if(location.hash && byId[location.hash.slice(1)]) $("intro").classList.add("hide");
boot();
})();
</script>
