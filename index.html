<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Maré Residencial Pirangi — Tour Virtual 360°</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%2317202e%22/%3E%3Cpath d=%22M5 13c4-3 7 3 11 0s7-3 11 0M5 19c4-3 7 3 11 0s7-3 11 0%22 stroke=%22%23b89662%22 stroke-width=%221.6%22 fill=%22none%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="lib/pannellum.css">
<style>
:root{
  --navy:#17202e; --navy2:#1f2b3d; --cream:#f1ece3; --sand:#d9c8ad; --gold:#b89662;
  --ink:#e9e4da; --muted:rgba(233,228,218,.62);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy);color:var(--ink);font-family:Jost,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#pano{position:fixed;inset:0;background:var(--navy)}

/* ---------- Pannellum overrides ---------- */
.pnlm-container{background:var(--navy)!important;font-family:Jost,sans-serif!important}
.pnlm-load-box,.pnlm-about-msg,.pnlm-controls-container,.pnlm-compass{display:none!important}
.pnlm-load-button,.pnlm-panel,.pnlm-title-box,.pnlm-author-box{display:none!important}
.pnlm-error-msg{background:rgba(23,32,46,.92)!important;font-family:Jost,sans-serif!important;border-radius:4px}

/* ---------- Hotspots ---------- */
.hs{position:absolute;width:0;height:0;cursor:pointer}
.hs .dot{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;
  background:rgba(23,32,46,.55);border:1.5px solid rgba(241,236,227,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;transition:transform .25s ease, background .25s}
.hs .dot svg{width:18px;height:18px;stroke:var(--cream);fill:none;stroke-width:1.6}
.hs .dot::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(241,236,227,.55);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.75);opacity:.9}100%{transform:scale(1.35);opacity:0}}
.hs .lbl{position:absolute;left:50%;top:30px;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  padding:6px 11px;background:rgba(23,32,46,.78);border-left:2px solid var(--gold);color:var(--cream);
  pointer-events:none;opacity:.95;transition:opacity .2s}
.hs:hover .dot{transform:scale(1.12);background:rgba(184,150,98,.75)}
.hs.info .dot{width:30px;height:30px;left:-15px;top:-15px;border-color:var(--gold)}
.hs.info .dot::after{display:none}
.hs.info .lbl{top:20px;border-left-color:var(--sand);font-weight:400}

/* ---------- Top bar ---------- */
#top{position:fixed;left:0;right:0;top:0;padding:calc(18px + var(--safe-t)) calc(22px + var(--safe-r)) 40px calc(22px + var(--safe-l));
  display:flex;align-items:flex-start;justify-content:space-between;gap:16px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(15,21,31,.72),rgba(15,21,31,0));z-index:5}
.brand{display:flex;flex-direction:column;gap:3px;pointer-events:auto}
.brand .wave{width:34px;height:10px}
.brand .name{font-family:"Cormorant Garamond",serif;font-size:26px;letter-spacing:.32em;line-height:1;margin-top:4px}
.brand .sub{font-size:9.5px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase}
.scene-meta{text-align:right;pointer-events:none;max-width:56vw}
.scene-meta .sector{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.scene-meta .title{font-size:17px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-top:6px;line-height:1.25}
.scene-meta .desc{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:300;line-height:1.4}

/* ---------- Bottom controls ---------- */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:0 calc(16px + var(--safe-r)) calc(14px + var(--safe-b)) calc(16px + var(--safe-l));
  background:linear-gradient(to top,rgba(15,21,31,.85),rgba(15,21,31,0));pointer-events:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:auto;padding-top:28px}
.btns{display:flex;gap:6px}
.ib{height:40px;min-width:40px;padding:0 12px;border-radius:20px;display:flex;align-items:center;gap:8px;
  background:rgba(23,32,46,.62);border:1px solid rgba(241,236,227,.22);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:background .2s,border-color .2s}
.ib svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.ib:hover{border-color:rgba(241,236,227,.5)}
.ib.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.ib .t{display:inline}
.counter{font-size:10.5px;letter-spacing:.26em;color:var(--muted);text-transform:uppercase}

/* drawer */
#drawer{pointer-events:auto;overflow:hidden;max-height:0;transition:max-height .45s cubic-bezier(.2,.7,.2,1),opacity .3s;opacity:0}
#drawer.open{max-height:260px;opacity:1}
.tabs{display:flex;gap:4px;margin:6px 0 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;padding:8px 12px;white-space:nowrap;color:var(--muted);border-bottom:1.5px solid transparent}
.tab.on{color:var(--cream);border-bottom-color:var(--gold)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:rgba(241,236,227,.25) transparent}
.th{flex:none;width:168px;scroll-snap-align:start;text-align:left;position:relative}
.th .img{width:168px;height:94px;background-size:340% auto;background-position:center;border:1px solid rgba(241,236,227,.18);transition:border-color .2s}
.th .cap{font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:7px;color:var(--muted);line-height:1.3}
.th.on .img{border:1.5px solid var(--gold)}
.th.on .cap{color:var(--cream)}
.th:hover .img{border-color:rgba(241,236,227,.6)}
.legal{font-size:9px;letter-spacing:.14em;color:rgba(233,228,218,.42);text-transform:uppercase;margin-top:8px;pointer-events:none}

/* ---------- Loader ---------- */
#loader{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:12px;
  pointer-events:none;opacity:0;transition:opacity .3s}
#loader.on{opacity:1}
#loader .bar2{width:120px;height:1px;background:rgba(241,236,227,.2);position:relative;overflow:hidden}
#loader .bar2::after{content:"";position:absolute;left:-40%;top:0;width:40%;height:100%;background:var(--gold);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{to{left:100%}}
#loader span{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}

/* ---------- Intro ---------- */
#intro{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background-size:cover;background-position:center;transition:opacity .9s ease, visibility .9s}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,21,31,.55),rgba(15,21,31,.82))}
#intro.hide{opacity:0;visibility:hidden}
.intro-in{position:relative;text-align:center;padding:24px;max-width:560px}
.intro-in .wave{width:64px;height:16px;margin:0 auto 18px;display:block}
.intro-in h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(52px,11vw,92px);letter-spacing:.3em;margin:0 0 0 .3em;line-height:1}
.intro-in .s1{font-size:11px;letter-spacing:.5em;text-transform:uppercase;margin-top:14px;color:var(--cream)}
.intro-in .rule{width:42px;height:1px;background:var(--gold);margin:26px auto}
.intro-in .s2{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.cta{margin-top:34px;display:inline-flex;align-items:center;gap:12px;padding:15px 28px;border:1px solid rgba(241,236,227,.7);
  font-size:12px;letter-spacing:.32em;text-transform:uppercase;transition:background .25s,color .25s}
.cta:hover{background:var(--cream);color:var(--navy)}
.cta svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.hint{margin-top:22px;font-size:10.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;line-height:1.8}
.intro-foot{position:absolute;bottom:calc(20px + var(--safe-b));left:0;right:0;text-align:center;font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:rgba(233,228,218,.5)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(10px);z-index:30;background:var(--cream);color:var(--navy);
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding:10px 16px;opacity:0;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
/* coords helper */
#coords{position:fixed;left:50%;top:50%;z-index:9;transform:translate(-50%,-50%);pointer-events:none;display:none;font:12px monospace;color:#fff;text-shadow:0 0 3px #000}
#coords::before{content:"+";display:block;text-align:center;font-size:22px}


/* ---------- Intro slideshow ---------- */
#intro{background:var(--navy)!important}
.kb{position:absolute;inset:0;overflow:hidden}
.kb div{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.8s ease;animation:kb 14s linear infinite;will-change:transform,opacity}
.kb div.on{opacity:1}
@keyframes kb{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.12) translate(-2%,-1%)}}
#intro::before{z-index:1}
.intro-in,.intro-foot{z-index:2}
.intro-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.intro-btns .cta{margin-top:0}
.cta.solid{background:var(--cream);color:var(--navy);border-color:var(--cream)}
.cta.solid:hover{background:transparent;color:var(--cream)}

/* ---------- Gallery ---------- */
#gal{position:fixed;inset:0;z-index:25;background:#0f151f;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s}
#gal.open{opacity:1;visibility:visible}
.g-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + var(--safe-t)) calc(18px + var(--safe-r)) 10px calc(18px + var(--safe-l))}
.g-chap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.g-chap::-webkit-scrollbar{display:none}
.g-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.g-stage img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .5s ease;user-select:none;-webkit-user-drag:none}
.g-stage img.on{opacity:1}
.g-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(23,32,46,.55);border:1px solid rgba(241,236,227,.3);display:grid;place-items:center;z-index:2}
.g-nav svg{width:20px;height:20px;stroke:var(--cream);fill:none;stroke-width:1.6}
.g-nav.l{left:16px}.g-nav.r{right:16px}
.g-cap{position:absolute;left:0;right:0;bottom:0;padding:40px 24px 16px;background:linear-gradient(to top,rgba(15,21,31,.85),rgba(15,21,31,0));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
.g-cap .k{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.g-cap .tt{font-size:18px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;margin-top:6px}
.g-cap .n{font-size:10.5px;letter-spacing:.26em;color:var(--muted)}
.g-cap .ib{pointer-events:auto}
.g-strip{display:flex;gap:6px;overflow-x:auto;padding:10px calc(18px + var(--safe-r)) calc(12px + var(--safe-b)) calc(18px + var(--safe-l));scrollbar-width:thin;scrollbar-color:rgba(241,236,227,.25) transparent}
.g-strip button{flex:none;width:96px;height:60px;background-size:cover;background-position:center;opacity:.5;border:1px solid transparent;transition:opacity .2s}
.g-strip button.on{opacity:1;border-color:var(--gold)}
.g-strip button:hover{opacity:.9}
.ib.photo{display:none}.ib.photo.has{display:flex}
@media (max-width:640px){.g-nav{display:none}.g-cap .tt{font-size:14px}.g-strip button{width:72px;height:46px}}

@media (max-width:640px){
  .brand .name{font-size:21px}
  .scene-meta .title{font-size:13.5px}
  .scene-meta .desc{display:none}
  .ib .t{display:none}
  .ib{padding:0;width:40px;justify-content:center}
  .ib.menu{width:auto;padding:0 14px}
  .ib.menu .t{display:inline}
  .th{width:132px}.th .img{width:132px;height:74px}
  .counter{display:none}
  .btns{gap:5px}
  .ib{width:38px;height:38px;min-width:38px}
  .legal{font-size:8px;letter-spacing:.1em}
  #bFull{display:none}
  #bPrev,#bNext{display:none}
  .hs .lbl{font-size:10px;padding:5px 9px}
}
</style>
</head>
<body>
<div id="pano"></div>

<div id="loader"><div class="bar2"></div><span>Carregando ambiente</span></div>

<header id="top">
  <div class="brand">
    <svg class="wave" viewBox="0 0 34 10"><path d="M1 3c4-2 8 2 12 0s8-2 12 0 6 1 8 0M1 7c4-2 8 2 12 0s8-2 12 0 6 1 8 0" stroke="#b89662" stroke-width="1" fill="none"/></svg>
    <div class="name">MARÉ</div>
    <div class="sub">Residencial Pirangi</div>
  </div>
  <div class="scene-meta">
    <div class="sector" id="mSector"></div>
    <div class="title" id="mTitle"></div>
    <div class="desc" id="mDesc"></div>
  </div>
</header>

<footer id="bottom">
  <div id="drawer">
    <div class="tabs" id="tabs"></div>
    <div class="strip" id="strip"></div>
  </div>
  <div class="bar">
    <div class="btns">
      <button class="ib menu" id="bMenu" aria-label="Ambientes"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="7"/><rect x="14" y="4" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="t">Ambientes</span></button>
      <button class="ib" id="bPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="ib" id="bNext" aria-label="Próximo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="counter" id="counter"></div>
    <div class="btns">
      <button class="ib photo" id="bPhoto" aria-label="Ver imagem deste ambiente"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><circle cx="9" cy="10" r="1.6"/><path d="M3 16l5-4 4 3 3-2 6 4"/></svg><span class="t">Imagem</span></button>
      <button class="ib" id="bGal" aria-label="Galeria"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13"/><path d="M8 21h13V8"/></svg><span class="t">Galeria</span></button>
      <button class="ib" id="bAuto" aria-label="Passeio automático"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span class="t">Passeio</span></button>
      <button class="ib" id="bShare" aria-label="Copiar link"><svg viewBox="0 0 24 24"><path d="M10 14a5 5 0 007 0l3-3a5 5 0 00-7-7l-1 1M14 10a5 5 0 00-7 0l-3 3a5 5 0 007 7l1-1"/></svg><span class="t">Link</span></button>
      <button class="ib" id="bFull" aria-label="Tela cheia"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </div>
  <div class="legal">Imagens ilustrativas · sujeitas a alterações no desenvolvimento do projeto</div>
</footer>

<section id="intro">
  <div class="kb" id="kb"></div>
  <div class="intro-in">
    <svg class="wave" viewBox="0 0 64 16"><path d="M2 5c7-4 14 4 21 0s14-4 21 0 12 2 18 0M2 11c7-4 14 4 21 0s14-4 21 0 12 2 18 0" stroke="#b89662" stroke-width="1.2" fill="none"/></svg>
    <h1>MARÉ</h1>
    <div class="s1">Residencial Pirangi</div>
    <div class="rule"></div>
    <div class="s2">Tour virtual 360° · Natal · RN</div>
    <div class="intro-btns"><button class="cta solid" id="bStart"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>Tour 360°</button><button class="cta" id="bPres"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14"/><path d="M3 15l5-4 4 3 3-2 6 4"/></svg>Apresentação</button></div>
    <div class="hint">Arraste para olhar ao redor · toque nos pontos para caminhar</div>
  </div>
  <div class="intro-foot">Imagens ilustrativas · sujeitas a alterações</div>
</section>

<section id="gal" aria-label="Galeria">
  <div class="g-top">
    <div class="g-chap" id="gChap"></div>
    <div class="btns">
      <button class="ib" id="gPlay" aria-label="Reproduzir"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg></button>
      <button class="ib" id="gClose" aria-label="Voltar ao tour"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="t">Fechar</span></button>
    </div>
  </div>
  <div class="g-stage" id="gStage">
    <img id="gImgA" alt=""><img id="gImgB" alt="" style="position:absolute">
    <button class="g-nav l" id="gPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="g-nav r" id="gNext" aria-label="Próxima"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div class="g-cap"><div><div class="k" id="gK"></div><div class="tt" id="gT"></div></div>
      <div style="display:flex;align-items:center;gap:12px"><span class="n" id="gN"></span><button class="ib" id="g360"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><path d="M12 3v2M12 19v2"/></svg><span class="t">Ver em 360°</span></button></div></div>
  </div>
  <div class="g-strip" id="gStrip"></div>
</section>

<div id="toast"></div>
<div id="coords"></div>

<script src="lib/pannellum.js"></script>
<script>
(function(){
"use strict";
/* ============ CONTEÚDO DO TOUR ============ */
var V = "2"; // versão das imagens: aumente ao trocar uma panorâmica

   h:[["estacionamento",-8,1,"Entrar no residencial","in"],["esquina",70,-3,"Perspectiva da esquina"],["posterior",-100,-3,"Fachada posterior"],["aerea",-6,26,"Vista aérea","up"]]},
  {id:"esquina", file:"04-fachada-esquina", s:"externas", t:"Perspectiva da esquina", d:"Volumetria das lajes curvas e terraços.", yaw:0, pitch:5,
   h:[["estacionamento",0,2,"Entrar no residencial","in"],["fachada-principal",-60,-4,"Fachada principal"],["lateral",65,-4,"Fachada lateral"]]},
  {id:"lateral", file:"06-fachada-lateral", s:"externas", t:"Fachada lateral", d:"Terraços em balanço voltados para o verde.", yaw:-4, pitch:5,
   h:[["estacionamento",-4,2,"Entrar no residencial","in"],["paisagem",90,-5,"Vista da paisagem"],["esquina",-90,-5,"Perspectiva da esquina"]]},
  {id:"paisagem", file:"05-fachada-vista-paisagem", s:"externas", t:"Vista da paisagem", d:"O conjunto inserido na paisagem de Pirangi.", yaw:2, pitch:4,

/* ============ MONTAGEM ============ */
var ICON = {
  go:'<svg viewBox="0 0 24 24"><path d="M12 19V6M6 11l6-6 6 6"/></svg>',
  "in":'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6M6 19l6-6 6 6"/></svg>',
  info:'<svg viewBox="0 0 24 24"><path d="M12 11v6M12 7.5v.5"/></svg>'
};
var byId = {}; SCENES.forEach(function(s,i){ s.i=i; byId[s.id]=s; });

function hotspotTooltip(div, a){
  div.classList.add("hs"); if(a.kind==="info") div.classList.add("info");
  div.innerHTML = '<div class="dot">'+(ICON[a.kind]||ICON.go)+'</div><div class="lbl">'+a.label+'</div>';
}
var scenesCfg = {};
SCENES.forEach(function(s){
  scenesCfg[s.id] = {
    title:s.t, type:"equirectangular", panorama:"pano/"+s.file+".jpg?v="+V,
    yaw:s.yaw, pitch:s.pitch, hfov:s.hfov||100,
    hotSpots: s.h.map(function(h){
      var kind=h[4]||"go", spot={pitch:+h[2], yaw:+h[1], cssClass:"hs-wrap",
        createTooltipFunc:hotspotTooltip, createTooltipArgs:{label:h[3],kind:kind}};
      if(h[0]){ spot.type="scene"; spot.sceneId=h[0]; spot.targetYaw="sameAzimuth"; }
      else { spot.type="info"; }
      // destino: abre na direção padrão do ambiente
      if(h[0]){ spot.targetYaw=byId[h[0]].yaw; spot.targetPitch=byId[h[0]].pitch; }
      return spot;
    })
  };
});

var start = (location.hash||"").slice(1); if(!byId[start]) start = "aerea";
var viewer = null, current = start, started = false;

/* intro background */


function boot(){
  viewer = pannellum.viewer("pano", {
    "default":{firstScene:start, sceneFadeDuration:900, autoLoad:true, showControls:false, compass:false,
      minHfov:40, maxHfov:120, friction:.12, mouseZoom:true, keyboardZoom:true,
      strings:{loadingLabel:"Carregando...", loadButtonLabel:"Carregar", bylineLabel:"",
        noPanoramaError:"Imagem não encontrada.", fileAccessError:"Não foi possível abrir a imagem.",
        malformedURLError:"Endereço inválido.", iOS8WebGLError:"Atualize o navegador.",
        genericWebGLError:"Seu navegador não suporta WebGL.",
        textureSizeError:"Esta imagem é grande demais para o seu dispositivo.", unknownError:"Erro desconhecido."}},
    scenes: scenesCfg
  });
  viewer.on("scenechange", function(id){ current=id; showLoader(true); updateUI(); });
  viewer.on("load", function(){ showLoader(false); prefetch(current); if(auto) scheduleAuto(); });
  viewer.on("mousedown", userInteracted); viewer.on("touchstart", userInteracted);
  showLoader(true); updateUI();
}

/* ============ UI ============ */
var $=function(id){return document.getElementById(id)};
function showLoader(on){ $("loader").classList.toggle("on", on); }
var activeSector=null;
function buildTabs(){
  $("tabs").innerHTML = SECTORS.map(function(s){ return '<button class="tab" data-s="'+s.id+'">'+s.name+'</button>'; }).join("");
  $("tabs").addEventListener("click", function(e){ var b=e.target.closest(".tab"); if(b) renderStrip(b.dataset.s); });
}
function thumbX(yaw){ var f=(yaw+180)/360, vis=1/3.4; return Math.max(0,Math.min(100,(f-vis/2)/(1-vis)*100)); }
function renderStrip(sid){
  activeSector=sid;
  [].forEach.call($("tabs").children, function(b){ b.classList.toggle("on", b.dataset.s===sid); });
  $("strip").innerHTML = SCENES.filter(function(s){return s.s===sid}).map(function(s){
    return '<button class="th'+(s.id===current?' on':'')+'" data-id="'+s.id+'"><div class="img" style="background-image:url(thumb/'+s.file+'.jpg?v='+V+');background-position:'+thumbX(s.yaw)+'% '+(50-s.pitch*0.6)+'%"></div><div class="cap">'+s.t+'</div></button>';
  }).join("");
}
$("strip").addEventListener("click", function(e){ var b=e.target.closest(".th"); if(b){ stopAuto(); go(b.dataset.id); } });

function updateUI(){
  var s=byId[current], sec=SECTORS.filter(function(x){return x.id===s.s})[0];
  $("mSector").textContent = sec.name;
  $("mTitle").textContent = s.t;
  $("mDesc").textContent = s.d;
  $("counter").textContent = String(s.i+1).padStart(2,"0")+" / "+String(SCENES.length).padStart(2,"0");
  renderStrip(s.s);
  var th=$("strip").querySelector(".th.on"); if(th && $("drawer").classList.contains("open")) th.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  try{ history.replaceState(null,"","#"+current); }catch(e){ try{ location.hash=current; }catch(_){} }
  document.title = s.t+" — Maré Residencial Pirangi";
  if(typeof photoFor==="function") $("bPhoto").classList.toggle("has", photoFor(current)>=0);
}
function go(id){ if(!viewer||id===current) return; var s=byId[id]; viewer.loadScene(id, s.pitch, s.yaw, s.hfov||100); }
function step(d){ var i=(byId[current].i+d+SCENES.length)%SCENES.length; go(SCENES[i].id); }

/* prefetch: aquece o cache dos próximos ambientes */
var fetched={};
function prefetch(id){
  var s=byId[id], next=[];
  s.h.forEach(function(h){ if(h[0]) next.push(h[0]); });
  next.push(SCENES[(s.i+1)%SCENES.length].id);
  next.slice(0,3).forEach(function(n){
    var u="pano/"+byId[n].file+".jpg?v="+V; if(fetched[u]) return; fetched[u]=1;
    setTimeout(function(){ try{ var im=new Image(); im.decoding="async"; im.src=u; }catch(e){} }, 600);
  });
}

/* passeio automático */
var auto=false, autoT=null;
function scheduleAuto(){ clearTimeout(autoT); viewer.startAutoRotate(-4); autoT=setTimeout(function(){ if(auto) step(1); }, 16000); }
function startAuto(){ auto=true; $("bAuto").classList.add("on"); scheduleAuto(); toast("Passeio automático ligado"); }
function stopAuto(){ if(!auto) return; auto=false; clearTimeout(autoT); $("bAuto").classList.remove("on"); try{viewer.stopAutoRotate();}catch(e){} }
function userInteracted(){ stopAuto(); }

$("bMenu").onclick=function(){ $("drawer").classList.toggle("open"); $("bMenu").classList.toggle("on"); updateUI(); };
$("bPrev").onclick=function(){ stopAuto(); step(-1); };
$("bNext").onclick=function(){ stopAuto(); step(1); };
$("bAuto").onclick=function(){ auto?stopAuto():startAuto(); };
$("bFull").onclick=function(){
  var el=document.documentElement;
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    else { var r=(el.requestFullscreen||el.webkitRequestFullscreen); if(r){ var p=r.call(el); if(p&&p.catch) p.catch(function(){ toast("Tela cheia indisponível aqui"); }); } else toast("Tela cheia indisponível aqui"); }
  }catch(e){ toast("Tela cheia indisponível aqui"); }
};
$("bShare").onclick=function(){
  var url=location.href.split("#")[0]+"#"+current;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){toast("Link deste ambiente copiado")},function(){toast(url)});
  } else toast(url);
};
var toastT; function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("on")},2600); }

$("bStart").onclick=function(){ $("intro").classList.add("hide"); if(!started){ started=true; } };
window.addEventListener("hashchange", function(){ var h=location.hash.slice(1); if(byId[h] && h!==current) go(h); });
document.addEventListener("keydown", function(e){
  if(e.key==="ArrowRight"&&e.shiftKey) step(1);
  if(e.key==="ArrowLeft"&&e.shiftKey) step(-1);
  if(e.key==="c"||e.key==="C"){ var c=$("coords"); c.style.display=c.style.display==="block"?"none":"block"; }
});
setInterval(function(){ var c=$("coords"); if(viewer&&c.style.display==="block") c.textContent=current+"  yaw "+viewer.getYaw().toFixed(0)+"  pitch "+viewer.getPitch().toFixed(0); }, 200);


/* ============ GALERIA / APRESENTAÇÃO ============ */

// [arquivo, capítulo, legenda, cena 360]
var PHOTOS=[
 ["ext-06-aerea-01","loc","Pirangi ao entardecer","aerea"],
 ["ext-07-aerea-02","loc","Pirangi à noite","aerea"],

 ["int-02-internas-4","apto","Suíte master","suite"],
 ["int-02-internas-5","apto","Suíte master","suite"],
 ["int-02-internas-3","apto","Quarto com vista mar","quarto2"],
 ["int-02-internas-1","apto","Quarto infantil","quarto3"]
];
var gi=0, gPlayT=null, gFlip=false;
function chapName(c){ return CHAPTERS.filter(function(x){return x.id===c})[0].name; }
$("gChap").innerHTML=CHAPTERS.map(function(c){return '<button class="tab" data-c="'+c.id+'">'+c.name+'</button>'}).join("");
$("gStrip").innerHTML=PHOTOS.map(function(p,i){return '<button data-i="'+i+'" style="background-image:url(imgthumb/'+p[0]+'.jpg)" aria-label="'+p[2]+'"></button>'}).join("");
function gShow(i){
  gi=(i+PHOTOS.length)%PHOTOS.length; var p=PHOTOS[gi];
  var a=$(gFlip?"gImgA":"gImgB"), b=$(gFlip?"gImgB":"gImgA"); gFlip=!gFlip;
  a.onload=function(){ a.classList.add("on"); b.classList.remove("on"); };
  a.src="img/"+p[0]+".jpg"; a.alt=p[2];
  $("gK").textContent=chapName(p[1]); $("gT").textContent=p[2];
  $("gN").textContent=String(gi+1).padStart(2,"0")+" / "+PHOTOS.length;
  $("g360").style.display=p[3]?"":"none";
  [].forEach.call($("gChap").children,function(b){b.classList.toggle("on",b.dataset.c===p[1])});
  [].forEach.call($("gStrip").children,function(b,j){b.classList.toggle("on",j===gi)});
  var t=$("gStrip").children[gi]; if(t) t.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
  var n=new Image(); n.src="img/"+PHOTOS[(gi+1)%PHOTOS.length][0]+".jpg";
}
function gOpen(i){ stopAuto(); $("gal").classList.add("open"); gShow(i||0); }
function gClose(){ gStop(); $("gal").classList.remove("open"); }
function gStart(){ $("gPlay").classList.add("on"); clearInterval(gPlayT); gPlayT=setInterval(function(){gShow(gi+1)},5500); }
function gStop(){ $("gPlay").classList.remove("on"); clearInterval(gPlayT); gPlayT=null; }
$("gPrev").onclick=function(){gStop();gShow(gi-1)};
$("gNext").onclick=function(){gStop();gShow(gi+1)};
$("gPlay").onclick=function(){ gPlayT?gStop():gStart(); };
$("gClose").onclick=gClose;
$("gStrip").onclick=function(e){var b=e.target.closest("button"); if(b){gStop();gShow(+b.dataset.i)}};
$("gChap").onclick=function(e){var b=e.target.closest(".tab"); if(!b) return; gStop(); for(var i=0;i<PHOTOS.length;i++) if(PHOTOS[i][1]===b.dataset.c){gShow(i);break;}};
$("g360").onclick=function(){ var sc=PHOTOS[gi][3]; gClose(); $("intro").classList.add("hide"); if(sc!==current) go(sc); };
(function(){ var x0=null; var st=$("gStage");
  st.addEventListener("touchstart",function(e){x0=e.touches[0].clientX},{passive:true});
  st.addEventListener("touchend",function(e){ if(x0===null) return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>45){gStop();gShow(gi+(dx<0?1:-1))} x0=null; });
})();
document.addEventListener("keydown",function(e){ if(!$("gal").classList.contains("open")) return;
  if(e.key==="ArrowRight"){gStop();gShow(gi+1)} if(e.key==="ArrowLeft"){gStop();gShow(gi-1)} if(e.key==="Escape") gClose(); });
$("bGal").onclick=function(){ var k=photoFor(current); gOpen(k<0?0:k); };
$("bPhoto").onclick=function(){ var k=photoFor(current); if(k>=0) gOpen(k); };
$("bPres").onclick=function(){ gOpen(0); gStart(); };
function photoFor(id){ for(var i=0;i<PHOTOS.length;i++) if(PHOTOS[i][3]===id) return i; return -1; }

/* abertura com as aéreas */
(function(){ var list=["ext-06-aerea-01","ext-07-aerea-02","ext-10-aerea-lazer","ext-01-fachada","ext-19-vista-piscina"], k=0, kb=$("kb");
  kb.innerHTML=list.map(function(f){return '<div style="background-image:url(img/'+f+'.jpg)"></div>'}).join("");
  var els=kb.children; els[0].classList.add("on");
  setInterval(function(){ if($("intro").classList.contains("hide")) return; els[k].classList.remove("on"); k=(k+1)%els.length; els[k].classList.add("on"); }, 5000);
})();

buildTabs();
// se abriu num link direto de ambiente, pula a abertura
if(location.hash && byId[location.hash.slice(1)]) $("intro").classList.add("hide");
boot();
})();
